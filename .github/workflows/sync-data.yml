name: Sync catalogue data
on:
  schedule:
    - cron: "0 17 * * *"   # 3am AEST nightly (UTC 17:00) — Brisbane local time (AEST, UTC+10). Note: Queensland does not observe DST.
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build games.json from BGG + sheet overlay
        env:
          SHEET_CSV_URL: ${{ vars.SHEET_CSV_URL }}
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
        run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "catalogue-bot"
          git config user.email "actions@github.com"
          # A fork with no sheet configured yet writes none of these files, which is the
          # normal state of a fresh install, not a failure. Adding a path that does not
          # exist is a fatal git error, so add only what the build actually produced.
          for f in data/games.json data/gaps.json data/gaps.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing changed tonight. On a fresh fork this means no sheet is configured yet: see SETUP.md."
            exit 0
          fi
          git commit -m "Nightly data sync"
          git push
